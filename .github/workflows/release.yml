name: Signed Windows release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: signed-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      INSTALLER_APP_ID: ${{ vars.INSTALLER_APP_ID }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Check release configuration
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          if (!$env:SIGNING_PFX_BASE64 -or !$env:SIGNING_PFX_PASSWORD) {
            throw 'SIGNING_PFX_BASE64 and SIGNING_PFX_PASSWORD secrets are required.'
          }
          $installerId = [guid]::Empty
          if (![guid]::TryParse($env:INSTALLER_APP_ID, [ref]$installerId) -or $installerId -eq [guid]::Empty) {
            throw 'Set INSTALLER_APP_ID to a permanent installer GUID in repository variables.'
          }
          [xml]$project = Get-Content -LiteralPath DualAutoClicker.csproj -Raw
          $version = [string]($project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          if ($env:RELEASE_TAG -cnotmatch '^v?\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$' -or
              ($env:RELEASE_TAG -creplace '^v', '') -cne $version) {
            throw 'Release tag must match the csproj Version (for example v3.2.4 and 3.2.4).'
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.401'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Publish application
        run: |
          # Select the supported SDK even when the runner has newer SDKs installed.
          '{"sdk":{"version":"8.0.401","rollForward":"disable"}}' | Set-Content -LiteralPath global.json
          dotnet publish DualAutoClicker.csproj -c Release -r win-x64 --self-contained true
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed.' }

      - name: Build and sign installer
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'release-signing.pfx'
          try {
            $pfxBytes = [Convert]::FromBase64String($env:SIGNING_PFX_BASE64)
            $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $pfxBytes, $env:SIGNING_PFX_PASSWORD,
              [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
            try {
              if (!$certificate.HasPrivateKey) { throw 'PFX must contain a private key.' }
              $now = Get-Date
              if ($certificate.NotBefore -gt $now -or $certificate.NotAfter -le $now) {
                throw 'Signing certificate is not currently valid.'
              }
              $codeSigning = $certificate.Extensions | Where-Object {
                $_ -is [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension] -and
                $_.EnhancedKeyUsages.Value -contains '1.3.6.1.5.5.7.3.3'
              }
              if (!$codeSigning) { throw 'PFX must contain a Code Signing certificate.' }
              $expectedThumbprint = $certificate.Thumbprint
            } finally {
              $certificate.Dispose()
            }
            [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
            Remove-Item Env:SIGNING_PFX_BASE64
            python build_installer.py --skip-publish --cert $pfxPath --app-id $env:INSTALLER_APP_ID
            if ($LASTEXITCODE -ne 0) { throw 'Installer build or signing failed.' }

            $artifacts = @(
              'bin/Release/net8.0-windows10.0.19041.0/win-x64/publish/DualAutoClicker.exe',
              'Output/DualAutoClicker-Setup.exe'
            )
            foreach ($artifact in $artifacts) {
              $signature = Get-AuthenticodeSignature -LiteralPath $artifact
              if ($signature.SignerCertificate.Thumbprint -ne $expectedThumbprint -or
                  !$signature.TimeStamperCertificate -or
                  $signature.Status -notin @('Valid', 'NotTrusted')) {
                throw "Signature or timestamp verification failed: $artifact"
              }
              # Self-signed certificates may be NotTrusted; do not install them as trusted roots.
              Write-Host "Signature status for ${artifact}: $($signature.Status)"
            }
            Move-Item -LiteralPath 'Output/DualAutoClicker-Setup.exe' -Destination 'Output/DualAutoClicker-setup.exe.tmp'
            Move-Item -LiteralPath 'Output/DualAutoClicker-setup.exe.tmp' -Destination 'Output/DualAutoClicker-setup.exe'
          } finally {
            if (Test-Path -LiteralPath $pfxPath) {
              Remove-Item -LiteralPath $pfxPath -Force
            }
          }

      - name: Attach installer to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload $env:RELEASE_TAG 'Output/DualAutoClicker-setup.exe' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }

      - name: Remove signing certificate
        if: always()
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'release-signing.pfx'
          if (Test-Path -LiteralPath $pfxPath) {
            Remove-Item -LiteralPath $pfxPath -Force
          }
